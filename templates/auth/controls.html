<div data-auth-controls aria-label="Cuenta de usuario">
  <div data-auth-signed-out>
    <button class="button button-secondary" type="button" data-auth-sign-in disabled>Iniciar sesión</button>
    <button class="button" type="button" data-auth-sign-up disabled>Crear cuenta</button>
  </div>
  <div data-auth-user hidden aria-label="Mi perfil"></div>
  <p data-auth-status role="status">Cargando acceso seguro…</p>
  <noscript>Activa JavaScript para iniciar sesión.</noscript>
</div>
