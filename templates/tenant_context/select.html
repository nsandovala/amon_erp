<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"><title>Seleccionar contexto · AMON ERP</title></head>
<body><main class="context-selector"><section class="context-card"><p class="eyebrow">AMON ERP</p><h1>Selecciona tu contexto</h1><p>Elige una organización y una sucursal autorizadas para continuar.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Organización<select name="organization_id" required>{% for membership in memberships %}<option value="{{ membership.organization_id }}">{{ membership.organization.name }}</option>{% endfor %}</select></label><label>Sucursal<select name="branch_id">{% for membership in memberships %}{% for branch in branches_by_organization[membership.organization_id] %}<option value="{{ branch.id }}">{{ membership.organization.name }} · {{ branch.name }}</option>{% endfor %}{% endfor %}</select></label><button class="button button-primary" type="submit">Continuar</button></form></section></main></body></html>
